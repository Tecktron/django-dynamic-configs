[tox]
requires =
    tox>=4
env_list =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    browser-{chromium,firefox,webkit}-django{52,61}
    extras
    lint
    docs
    coverage
skip_missing_interpreters = true

[testenv]
description = Run the test suite under coverage
package = wheel
wheel_build_env = .pkg
deps =
    coverage
    pytest
    pytest-django
    pytest-mock
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
commands =
    # The browser environments run the browser tests: the scripts don't change with Python, so they run on the oldest
    # and newest Django, whose admin markup they work with.
    coverage run -m pytest --ignore=tests/browser {posargs}

[testenv:browser-{chromium,firefox,webkit}-django{52,61}]
description = Run the admin's scripts with Playwright, in the browser engine the environment names
base_python = python3.14
deps =
    pytest
    pytest-django
    pytest-mock
    pytest-playwright
    django52: Django>=5.2,<5.3
    django61: Django>=6.1,<6.2
set_env =
    # Keep the browser inside this environment's Playwright package.
    PLAYWRIGHT_BROWSERS_PATH = 0
# One engine per environment, installing only its own browser, so a failure names its browser.
commands_pre =
    chromium: playwright install --only-shell chromium
    firefox: playwright install firefox
    webkit: playwright install webkit
# Without coverage: the matrix environments hold the Python code to 100%.
commands =
    chromium: pytest tests/browser --browser chromium {posargs}
    firefox: pytest tests/browser --browser firefox {posargs}
    webkit: pytest tests/browser --browser webkit {posargs}

[testenv:extras]
description = Run the test suite with the django-simple-history integration installed
base_python = python3.14
deps =
    coverage
    pytest
    pytest-django
    pytest-mock
    Django>=6.1,<6.2
extras = simple-history
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
    DYNAMIC_CONFIGS_TEST_EXTRAS = 1
commands =
    coverage run -m pytest --ignore=tests/browser {posargs}

[testenv:postgres]
description = Run the test suite on PostgreSQL (connection from libpq's PG* variables)
base_python = python3.14
deps =
    coverage
    pytest
    pytest-django
    pytest-mock
    Django>=6.1,<6.2
    psycopg[binary]
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
    DYNAMIC_CONFIGS_TEST_POSTGRES = 1
pass_env =
    PG*
commands =
    coverage run -m pytest --ignore=tests/browser {posargs}

[testenv:redis]
description = Run the test suite against a Redis server (Django's backend), at DYNAMIC_CONFIGS_TEST_REDIS_URL
base_python = python3.14
deps =
    coverage
    pytest
    pytest-django
    pytest-mock
    Django>=6.1,<6.2
    redis
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
    DYNAMIC_CONFIGS_TEST_CACHE = redis
pass_env =
    DYNAMIC_CONFIGS_TEST_REDIS_URL
commands =
    coverage run -m pytest --ignore=tests/browser {posargs}

[testenv:redis-json]
description = Run the test suite against a Redis server (django-redis, JSON), at DYNAMIC_CONFIGS_TEST_REDIS_URL
base_python = python3.14
# Django 6.0: django-redis doesn't list 6.1 yet.
deps =
    coverage
    pytest
    pytest-django
    pytest-mock
    Django>=6.0,<6.1
    django-redis
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
    DYNAMIC_CONFIGS_TEST_CACHE = redis-json
pass_env =
    DYNAMIC_CONFIGS_TEST_REDIS_URL
commands =
    coverage run -m pytest --ignore=tests/browser {posargs}

[testenv:memcached]
description = Run the test suite against a Memcached server (pymemcache), at DYNAMIC_CONFIGS_TEST_MEMCACHED
base_python = python3.14
deps =
    coverage
    pytest
    pytest-django
    pytest-mock
    Django>=6.1,<6.2
    pymemcache
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
    DYNAMIC_CONFIGS_TEST_CACHE = memcached
pass_env =
    DYNAMIC_CONFIGS_TEST_MEMCACHED
commands =
    coverage run -m pytest --ignore=tests/browser {posargs}

[testenv:djangomain]
description = Run the test suite on Django's development version (may fail while main changes)
base_python = python3.14
deps =
    coverage
    pytest
    pytest-django
    pytest-mock
    Django @ https://github.com/django/django/archive/refs/heads/main.tar.gz
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
commands =
    coverage run -m pytest --ignore=tests/browser {posargs}

[testenv:docs]
description = Build the documentation site, with warnings as errors
base_python = python3.14
deps = -r docs/requirements.txt
commands =
    sphinx-build -W --keep-going -b html docs docs/_build/html

[testenv:coverage]
description = Combine the coverage of every test environment and enforce 100%
skip_install = true
deps = coverage
depends =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    extras
    redis
    redis-json
    memcached
set_env =
    # Apart from the per-environment files: the report commands combine any .coverage.* beside their data file, and
    # delete what they combined.
    COVERAGE_FILE = {env_dir}{/}.coverage
commands =
    coverage combine --keep {work_dir}
    # The HTML report doesn't enforce the minimum, so the text report below always runs: it lists the missing lines
    # and fails under 100%.
    coverage html --fail-under=0
    coverage report

[testenv:lint]
description = Check style and formatting with ruff
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .
