[tox]
requires =
    tox>=4
env_list =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    browser
    lint
skip_missing_interpreters = true

[testenv]
description = Run the test suite under coverage
package = wheel
wheel_build_env = .pkg
deps =
    coverage
    pytest
    pytest-django
    pytest-mock
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
commands =
    # The browser tests run once, in the browser environment: the scripts don't change with Python or Django.
    coverage run -m pytest --ignore=tests/browser {posargs}

[testenv:browser]
description = Run the admin's scripts in Chromium with Playwright
base_python = python3.14
deps =
    pytest
    pytest-django
    pytest-mock
    pytest-playwright
    Django>=6.1,<6.2
set_env =
    # Keep the browser inside this environment's Playwright package.
    PLAYWRIGHT_BROWSERS_PATH = 0
commands_pre =
    playwright install --only-shell chromium
# Without coverage: the matrix environments hold the Python code to 100%.
commands =
    pytest tests/browser {posargs}

[testenv:lint]
description = Check style and formatting with ruff
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .
