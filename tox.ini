[tox]
requires =
    tox>=4
env_list =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    lint
skip_missing_interpreters = true

[testenv]
description = Run the test suite under coverage
package = wheel
wheel_build_env = .pkg
deps =
    coverage
    pytest
    pytest-django
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
set_env =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
commands =
    coverage run -m pytest {posargs}

[testenv:lint]
description = Check style and formatting with ruff
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .
